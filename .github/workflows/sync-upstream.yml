name: Sync upstream and release

on:
  schedule:
    # 每 2 小时检查一次
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Check upstream latest release
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        set -euo pipefail

        # 获取上游最新 release（含 prerelease）完整信息
        # 必须带 token 认证：GitHub Actions runner 共享 Azure 出口 IP，
        # 匿名 API 限流（60次/小时/IP）几乎常年被打满，会返回错误对象
        # {"message":"API rate limit exceeded",...} 而非数组，导致 jq '.[0]' 崩溃。
        HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/upstream_releases.json \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/2dust/v2rayN/releases?per_page=1")
        echo "上游 releases API HTTP: $HTTP_CODE"

        # 非 200，或返回体不是 JSON 数组（限流/错误对象），优雅跳过而非硬崩
        if [ "$HTTP_CODE" != "200" ] || [ "$(jq -r 'type' /tmp/upstream_releases.json 2>/dev/null)" != "array" ]; then
          echo "::warning::获取上游 release 列表失败（HTTP $HTTP_CODE），本次跳过"
          echo "响应内容（前 500 字符）:"; head -c 500 /tmp/upstream_releases.json; echo
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 数组为空 => 上游暂无 release
        if [ "$(jq 'length' /tmp/upstream_releases.json)" -eq 0 ]; then
          echo "上游暂无 release，跳过"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 直接从文件按字段取，避免把整条 release 塞进 shell 变量再二次解析
        #（body 含控制字符会让某些 jq 版本 round-trip 时报错）
        UPSTREAM_TAG=$(jq -r '.[0].tag_name' /tmp/upstream_releases.json)
        echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"
        echo "上游最新版（含 prerelease）: $UPSTREAM_TAG"

        if [ "$UPSTREAM_TAG" == "null" ] || [ -z "$UPSTREAM_TAG" ]; then
          echo "无法获取上游 release 信息（tag 为空）"
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        # 提取 release body 和 prerelease 状态
        UPSTREAM_PRERELEASE=$(jq -r '.[0].prerelease' /tmp/upstream_releases.json)
        echo "upstream_prerelease=$UPSTREAM_PRERELEASE" >> "$GITHUB_OUTPUT"

        # body 可能含多行，直接写文件传递
        jq -r '.[0].body // ""' /tmp/upstream_releases.json > /tmp/release_body.txt
        echo "上游 prerelease: $UPSTREAM_PRERELEASE"

        # 检查 mod 仓库是否已有该版本的 release
        MOD_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$UPSTREAM_TAG")

        if [ "$MOD_STATUS" == "200" ]; then
          echo "Mod 仓库已有 $UPSTREAM_TAG release，跳过"
          echo "skip=true" >> "$GITHUB_OUTPUT"
        else
          echo "发现新版本 $UPSTREAM_TAG，开始同步"
          echo "skip=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout mod repo
      if: steps.check.outputs.skip != 'true'
      uses: actions/checkout@v6.0.2
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Sync upstream code
      if: steps.check.outputs.skip != 'true'
      run: |
        UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"

        # 备份 mod 仓库的 .github 目录（避免被上游覆盖）
        cp -r .github /tmp/.github-backup

        # 备份 mod 自定义 README（去广告横幅/改过链接），避免被上游 reset 覆盖
        cp README.md /tmp/docbak_readme.md 2>/dev/null || true

        # 添加上游 remote
        git remote add upstream https://github.com/2dust/v2rayN.git || true
        git fetch upstream --tags --force

        # 配置 git
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # reset 到上游 tag 对应的 commit
        git reset --hard "$UPSTREAM_TAG"

        # 恢复 mod 仓库的 .github 目录
        rm -rf .github
        cp -r /tmp/.github-backup .github
        echo "✅ 已恢复 mod 仓库的 .github 目录"

        # 恢复 mod 自定义 README
        cp /tmp/docbak_readme.md README.md 2>/dev/null || true
        echo "✅ 已恢复 mod 自定义 README"

    - name: Remove promotion code
      if: steps.check.outputs.skip != 'true'
      run: |
        python3 << 'PYTHON_SCRIPT'
        import os
        import sys

        def read_file(file_path):
            with open(file_path, 'r', encoding='utf-8') as f:
                return f.readlines()

        def write_file(file_path, lines):
            with open(file_path, 'w', encoding='utf-8') as f:
                f.writelines(lines)

        def remove_lines_containing(lines, text):
            return [line for line in lines if text not in line]

        def replace_in_lines(lines, old, new):
            return [line.replace(old, new) for line in lines]

        def remove_method_block(lines, method_signature):
            final_lines = []
            skip_block = False
            for line in lines:
                if method_signature in line:
                    skip_block = True
                    continue
                if skip_block:
                    if line.strip() == '}':
                        skip_block = False
                        continue
                if not skip_block:
                    final_lines.append(line)
            return final_lines

        def remove_xml_block(lines, identifier):
            result_lines = []
            i = 0
            while i < len(lines):
                line = lines[i]
                if identifier in line:
                    if '/>' in line:
                        start = i
                        while start > 0 and '<MenuItem' not in lines[start]:
                            start -= 1
                        i += 1
                        continue
                    else:
                        start = i
                        while start > 0 and '<MenuItem' not in lines[start]:
                            start -= 1
                        end = i
                        while end < len(lines) and '</MenuItem>' not in lines[end]:
                            end += 1
                        if end < len(lines):
                            end += 1
                        while len(result_lines) > 0 and result_lines[-1] == lines[start]:
                            result_lines.pop()
                            start += 1
                        i = end
                        continue
                result_lines.append(line)
                i += 1
            return result_lines

        def remove_menu_block(lines, identifier):
            start_index = -1
            end_index = -1
            for i, line in enumerate(lines):
                if identifier in line:
                    start_index = i
                    while start_index >= 0 and '<Menu' not in lines[start_index].strip():
                        start_index -= 1
                    end_index = i
                    while end_index < len(lines):
                        if '<Separator' in lines[end_index]:
                            end_index += 1
                            break
                        end_index += 1
                    break
            if start_index >= 0 and end_index >= 0:
                return lines[:start_index] + lines[end_index:]
            return lines

        def remove_duplicate_menu_lines(lines):
            result_lines = []
            prev_line = None
            for line in lines:
                if line.strip() != prev_line:
                    result_lines.append(line)
                    prev_line = line.strip()
            return result_lines

        # 定义要处理的文件和操作
        operations = {
            'v2rayN/ServiceLib/Global.cs': [
                # 铁律：不删 PromotionUrl 常量(仅被 MenuPromotion_Click 引用，随菜单一起删)。
                # 保留这个无引用的 public const 编译无碍，却能避免将来上游新增引用时
                # 因删常量而悬空引用、导致编译失败、release 变空(参见安卓版同类事故)。
                ('replace', '"2dust/v2rayN"', '"LOVECHEN/v2rayN-mod"'),
            ],
            'v2rayN/v2rayN.Desktop/Views/MainWindow.axaml': [
                ('remove_xml', 'x:Name="menuPromotion"')
            ],
            'v2rayN/v2rayN.Desktop/Views/MainWindow.axaml.cs': [
                ('remove_lines', 'menuPromotion.Click += MenuPromotion_Click;'),
                ('remove_method', 'private void MenuPromotion_Click')
            ],
            'v2rayN/v2rayN/Views/MainWindow.xaml': [
                ('remove_menu', 'x:Name="menuPromotion"'),
                ('remove_duplicate_menu', None)
            ],
            'v2rayN/v2rayN/Views/MainWindow.xaml.cs': [
                ('remove_lines', 'menuPromotion.Click += MenuPromotion_Click;'),
                ('remove_method', 'private void MenuPromotion_Click')
            ]
        }

        success = 0
        total = len(operations)

        for rel_path, ops in operations.items():
            if not os.path.exists(rel_path):
                print(f"文件不存在，跳过: {rel_path}")
                continue
            try:
                lines = read_file(rel_path)
                for op in ops:
                    op_type = op[0]
                    text = op[1]
                    if op_type == 'remove_lines':
                        lines = remove_lines_containing(lines, text)
                    elif op_type == 'remove_method':
                        lines = remove_method_block(lines, text)
                    elif op_type == 'remove_xml':
                        lines = remove_xml_block(lines, text)
                    elif op_type == 'replace':
                        lines = replace_in_lines(lines, text, op[2])
                    elif op_type == 'remove_menu':
                        lines = remove_menu_block(lines, text)
                    elif op_type == 'remove_duplicate_menu':
                        lines = remove_duplicate_menu_lines(lines)
                write_file(rel_path, lines)
                success += 1
                print(f"✅ {rel_path}")
            except Exception as e:
                print(f"❌ {rel_path}: {e}")

        print(f"\n处理完成: {success}/{total}")
        if success < total:
            print("⚠️ 部分文件处理失败，但继续执行")
        PYTHON_SCRIPT

    - name: Commit and push
      if: steps.check.outputs.skip != 'true'
      run: |
        UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"

        git add -A
        git commit -m "Sync upstream $UPSTREAM_TAG - Remove promotions and auto-updates"
        git push --force origin master

        # 创建对应的 tag
        git tag -f "$UPSTREAM_TAG"
        git push --force origin "$UPSTREAM_TAG"

    - name: Create release with upstream info
      if: steps.check.outputs.skip != 'true'
      run: |
        UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"
        UPSTREAM_PRERELEASE="${{ steps.check.outputs.upstream_prerelease }}"

        # 用 Python heredoc 构造 JSON 避免转义问题
        export UPSTREAM_TAG UPSTREAM_PRERELEASE
        python3 << 'PYEOF'
        import json, os

        upstream_body = open('/tmp/release_body.txt').read().strip()

        macos_note = (
            "\n\n"
            "---\n"
            "### macOS 用户注意\n\n"
            "如果打开 app 时提示「无法打开」或「移到废纸篓」，请在终端执行：\n\n"
            "```bash\n"
            "# 方法一：移除隔离属性（推荐）\n"
            "xattr -cr /Applications/v2rayN.app\n\n"
            "# 方法二：重新签名\n"
            "codesign --force --deep --sign - /Applications/v2rayN.app\n"
            "```\n"
        )

        body = upstream_body + macos_note

        payload = {
            'tag_name': os.environ['UPSTREAM_TAG'],
            'target_commitish': 'master',
            'name': '',
            'body': body,
            'draft': False,
            'prerelease': os.environ['UPSTREAM_PRERELEASE'] == 'true'
        }
        with open('/tmp/release_payload.json', 'w') as f:
            json.dump(payload, f)
        PYEOF

        echo "预创建 release $UPSTREAM_TAG (prerelease=$UPSTREAM_PRERELEASE)"
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/releases" \
          -d @/tmp/release_payload.json

        echo "✅ Release 已创建，信息与上游一致"

    - name: Trigger build-all workflow
      if: steps.check.outputs.skip != 'true'
      run: |
        UPSTREAM_TAG="${{ steps.check.outputs.upstream_tag }}"

        echo "触发 build-all.yml，release_tag=$UPSTREAM_TAG"
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-all.yml/dispatches" \
          -d '{"ref":"master","inputs":{"release_tag":"'"$UPSTREAM_TAG"'"}}'

        echo "✅ 构建已触发，版本: $UPSTREAM_TAG"

    - name: Ensure latest upstream stable is mirrored
      if: always()
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # 主流程只跟上游【最新单个】release（常为 prerelease）；这里独立保证 mod 的
        # 稳定通道跟上上游【最新正式版】。二者不同且 mod 未跟上时，dispatch backfill.yml。
        curl -sS -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/2dust/v2rayN/releases?per_page=30" > /tmp/up_rel.json \
          || { echo "拉取上游失败，跳过"; exit 0; }
        [ "$(jq -r 'type' /tmp/up_rel.json 2>/dev/null)" = "array" ] || { echo "上游响应异常，跳过"; exit 0; }
        LATEST_TAG=$(jq -r '.[0].tag_name // ""' /tmp/up_rel.json)
        STABLE_TAG=$(jq -r '[.[] | select(.prerelease==false)] | .[0].tag_name // ""' /tmp/up_rel.json)
        echo "上游最新=$LATEST_TAG  最新正式版=$STABLE_TAG"
        [ -n "$STABLE_TAG" ] || { echo "上游近30个无正式版，跳过"; exit 0; }
        if [ "$STABLE_TAG" = "$LATEST_TAG" ]; then
          echo "最新正式版即最新版（由主流程处理），跳过"; exit 0
        fi
        # 用 -o 文件 + 对文件 jq；.prerelease 是布尔，绝不能用 `// empty`
        # （false // empty == empty，会把正式版误判成"没有"→ 每次误触发 backfill）。
        HTTP=$(curl -sS -o /tmp/mod_rel.json -w "%{http_code}" -H "Authorization: token $GH_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/releases/tags/$STABLE_TAG")
        MOD_ID=$(jq -r '.id // ""' /tmp/mod_rel.json 2>/dev/null)
        MOD_PRE=$(jq -r '.prerelease' /tmp/mod_rel.json 2>/dev/null)
        if [ "$HTTP" = "200" ] && [ -n "$MOD_ID" ] && [ "$MOD_PRE" = "false" ]; then
          echo "mod 已有正式版 $STABLE_TAG，无需补建"; exit 0
        fi
        echo "需补建正式版 $STABLE_TAG → dispatch backfill.yml"
        curl -sS -X POST -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/backfill.yml/dispatches" \
          -d "{\"ref\":\"master\",\"inputs\":{\"tag\":\"$STABLE_TAG\",\"prerelease\":\"false\"}}" \
          && echo "✅ 已触发 backfill($STABLE_TAG)"
